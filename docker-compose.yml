# 飞牛 fnOS 部署：Docker → Compose → 新增项目，直接粘贴以下内容即可（无需拷贝源码到 NAS）
# 修改 APP_PASSWORD（登录密码）和 volumes 左侧的 NAS 数据目录路径即可启动
# 更新：在飞牛 Docker → Compose 中点击该项目「更新 / 拉取最新镜像并重建」即可
services:
  usvault:
    image: ghcr.io/sonicx2025/usvault:latest
    container_name: usvault
    restart: unless-stopped
    ports:
      - "8080:8080"            # 浏览器访问 http://NAS地址:8080
    environment:
      - APP_PASSWORD=请改成你的密码
      - TZ=Asia/Shanghai
    volumes:
      # 左边改成你 NAS 上的存放目录（数据库 + 原始图片视频 + 缩略图都在这里）
      - /vol1/1000/超声影像库:/data
