<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>超声影像库</title>
  <meta name="theme-color" content="#09090b" id="metaTheme">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="超声影像库">
  <script>
    (() => {
      const t = localStorage.getItem('usv_theme') || 'dark';
      document.documentElement.dataset.theme = t;
      const m = document.getElementById('metaTheme');
      if (m) m.content = t === 'light' ? '#f5f5f7' : '#09090b';
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <img src="/icons/icon-192.png" alt="">
        <span class="brand-name">超声影像库</span>
      </a>
      <nav class="top-actions">
        <a href="#/followups" class="btn ghost nav-fu" data-nav="/followups" title="随访提醒">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="hide-sm">随访</span>
          <span class="nav-badge" id="fuBadge" hidden></span>
        </a>
        <a href="#/settings" class="btn ghost" data-nav="/settings" title="设置">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="hide-sm">设置</span>
        </a>
        <button class="btn ghost icon-only" id="themeBtn" title="切换浅色/深色主题" aria-label="切换主题"></button>
        <a href="#/new" class="btn primary">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>新建记录</span>
        </a>
        <button class="btn ghost icon-only" id="logoutBtn" title="退出登录" aria-label="退出登录">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-bar">
      <span id="lbInfo" class="lb-info"></span>
      <div class="lb-acts">
        <a class="btn ghost sm" id="lbDownload" download>
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>下载</span>
        </a>
        <button class="btn ghost sm" id="lbClose" aria-label="关闭">
          <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <button class="lb-nav prev" id="lbPrev" aria-label="上一张">
      <svg class="ico" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-nav next" id="lbNext" aria-label="下一张">
      <svg class="ico" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <datalist id="dlParts"></datalist>
  <datalist id="dlTags"></datalist>

  <script src="/pathology_dict.js"></script>
  <script src="/app.js"></script>
</body>
</html>
