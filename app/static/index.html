<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>超声影像库</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="超声影像库">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a href="#/" class="brand"><img src="/icons/icon-192.png" alt=""><span>超声影像库</span></a>
    <div class="top-actions">
      <a href="#/new" class="btn primary">＋ 新建记录</a>
      <a href="#/settings" class="btn ghost" title="字段设置">⚙<span class="hide-sm"> 字段设置</span></a>
      <button class="btn ghost" id="logoutBtn" title="退出登录">退出</button>
    </div>
  </header>
  <main id="app"></main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-bar">
      <span id="lbInfo"></span>
      <div>
        <a class="btn ghost" id="lbDownload" download>下载</a>
        <button class="btn ghost" id="lbClose">关闭 ✕</button>
      </div>
    </div>
    <button class="lb-nav prev" id="lbPrev">‹</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-nav next" id="lbNext">›</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <datalist id="dlParts"></datalist>
  <datalist id="dlTags"></datalist>

  <script src="/app.js"></script>
</body>
</html>
